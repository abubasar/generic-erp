<mat-card>
  <mat-expansion-panel
    class="mat-elevation-z0"
    (opened)="panelOpenState = true"
    (closed)="panelOpenState = false"
  >
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>search_icon</mat-icon> Search
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <mat-form-field class="full-width">
        <mat-label>Search By Keyword</mat-label>
        <input matInput formControlName="keyword" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>search_icon</mat-icon>Search
      </button>
    </form>
  </mat-expansion-panel>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="button-container d-flex justify-content-between">
      <button
        *appHasPermission="['Permissions.Tenants.Create']"
        mat-raised-button
        color="primary"
        (click)="openForm()"
      >
        <!-- + Add New Tenant -->
        <mat-icon>add_box</mat-icon>
        Add New
      </button>
      <div>
        <button
          mat-icon-button
          color="primary"
          (click)="reload()"
          matTooltip="Reload"
          matTooltipPosition="above"
        >
          <mat-icon>refresh</mat-icon>
        </button>
        <button
          mat-icon-button
          color="primary"
          matTooltip="print pdf"
          matTooltipShowDelay="300"
          matTooltipPosition="above"
          (click)="printPdf()"
        >
          <mat-icon>print</mat-icon>
        </button>
      </div>
    </div>
    <ng-container *ngIf="!loading; else loadingSkeleton">
      <div
        class="table-responsive"
        *ngIf="dataSource.data.length > 0; else noDataFound"
      >
        <table
          class="border border-1 table-bordered"
          mat-table
          [dataSource]="dataSource"
        >
          <!-- Code Column -->
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Code</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.code }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant.name }}</td>
          </ng-container>

          <!-- Time Zone Id Column -->
          <ng-container matColumnDef="timeZoneId">
            <th mat-header-cell *matHeaderCellDef>Time Zone</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.timeZoneId }}</td>
          </ng-container>

          <!-- Address Column -->
          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Address</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.address }}</td>
          </ng-container>

          <!-- ContactNo Column -->
          <ng-container matColumnDef="contactNo">
            <th mat-header-cell *matHeaderCellDef>Contact No</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.contactNo }}</td>
          </ng-container>

          <!-- binno Column -->
          <ng-container matColumnDef="binno">
            <th mat-header-cell *matHeaderCellDef>BIN No</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.binno }}</td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let tenant">{{ tenant?.email }}</td>
          </ng-container>

          <!-- Actions Column -->
          <!-- <ng-container matColumnDef="actions">
            <th style="text-align: center" mat-header-cell *matHeaderCellDef>
              Actions
            </th>
            <td align="center" mat-cell *matCellDef="let tenant">
              <button
                *appHasPermission="['Permissions.Tenants.Edit']"
                mat-icon-button
                color="primary"
                matTooltip="Edit"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="openForm(tenant)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                *appHasPermission="['Permissions.Tenants.Delete']"
                mat-icon-button
                color="warn"
                matTooltip="Delete"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="confirmDelete(tenant.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container> -->

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="table-row"
            tabindex="1"
          ></tr>
        </table>
      </div>

      <mat-paginator
        *ngIf="totalCount > 0"
        [length]="totalCount"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select page of tenant list"
      >
      </mat-paginator>
    </ng-container>
  </mat-card-content>
</mat-card>

<!-- loader start -->
<ng-template #loadingSkeleton>
  <app-loading-skeleton></app-loading-skeleton>
</ng-template>
<!-- No Data Found -->
<ng-template #noDataFound>
  <app-no-data-found></app-no-data-found>
</ng-template>
