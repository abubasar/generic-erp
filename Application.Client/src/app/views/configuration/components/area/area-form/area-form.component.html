<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="areaForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Area Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter area name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          areaForm.controls['name'].hasError('required') &&
          areaForm.controls['name'].touched
        "
      >
        Area name is required
      </mat-error>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Select Zone</mat-label>
      <mat-select formControlName="zoneId">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let zone of zones" [value]="zone.id">
          {{ zone.name }}
        </mat-option>
      </mat-select>
      <mat-error>Zone is required</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!areaForm.dirty || !areaForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
