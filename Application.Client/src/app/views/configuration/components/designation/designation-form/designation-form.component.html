<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="designationForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Designation Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter designation name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          designationForm.controls['name'].hasError('required') &&
          designationForm.controls['name'].touched
        "
      >
        Designation name is required
      </mat-error>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Select Department</mat-label>
      <mat-select formControlName="departmentId">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let d of departments" [value]="d.id">
          {{ d.name }}
        </mat-option>
      </mat-select>
      <mat-error>Department is required</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!designationForm.dirty || !designationForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
