<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="packSizeForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Pack Size Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter pack size name"
        formControlName="name"
        />
        @if (
          packSizeForm.controls['name'].hasError('required') &&
          packSizeForm.controls['name'].touched
          ) {
          <mat-error
            >
            Pack Size name is required
          </mat-error>
        }
      </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-raised-button mat-dialog-close>Cancel</button>
      <button
        mat-raised-button
        [mat-dialog-close]="true"
        cdkFocusInitial
        color="primary"
        [disabled]="!packSizeForm.dirty || !packSizeForm.valid"
        type="submit"
        >
        Save
      </button>
    </mat-dialog-actions>
  </form>
