<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="genericForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Generic Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter generic name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          genericForm.controls['name'].hasError('required') &&
          genericForm.controls['name'].touched
        "
      >
        Generic name is required
      </mat-error>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Select Product Type</mat-label>
      <mat-select formControlName="productTypeId">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let productType of productTypes" [value]="productType.id">
          {{ productType.name }}
        </mat-option>
      </mat-select>
      <mat-error>Product Type is required</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!genericForm.dirty || !genericForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
