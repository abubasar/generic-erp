<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />

    <mat-form-field class="full-width">
      <mat-label>Select Employee</mat-label>
      <input
        type="text"
        matInput
        name="employeeId"
        formControlName="employeeId"
        [matAutocomplete]="auto"
        (input)="onControlEmployeeChange($event)"
      />
      <mat-autocomplete
        #auto="matAutocomplete"
        [displayWith]="getEmployeeName.bind(this)"
      >
        <mat-option *ngFor="let d of filterEmployees" [value]="d.id">
          {{ d.fullName }}
        </mat-option>
      </mat-autocomplete>
      <mat-error>Employee is required</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Username</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter user name"
        formControlName="username"
      />
      <mat-error
        *ngIf="
          userForm.controls['username'].hasError('required') &&
          userForm.controls['username'].touched
        "
      >
        Username is required
      </mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Password</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter password"
        formControlName="password"
      />
      <mat-error
        *ngIf="
          userForm.controls['password'].hasError('required') &&
          userForm.controls['password'].touched
        "
      >
        Password is required
      </mat-error>
      <mat-error
        *ngIf="
          userForm.controls['password'].hasError('pattern') &&
          userForm.controls['password'].touched
        "
      >
        Password must have at least 6 characters, including lowercase,
        uppercase,special character and digits.
      </mat-error>
    </mat-form-field>
    <mat-form-field class="full-width">
      <mat-label>Select Role</mat-label>
      <mat-select formControlName="roleId">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let d of roles" [value]="d.id">
          {{ d.name }}
        </mat-option>
      </mat-select>
      <mat-error>Role is required</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!userForm.dirty || !userForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
