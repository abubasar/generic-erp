<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="accountForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <!-- Account Code -->
    <div [hidden]="!isEditMode">
      <mat-form-field>
        <mat-label>Account Code</mat-label>
        <input
          matInput
          autocomplete="off"
          placeholder="Enter Account Code"
          formControlName="code"
        />
        <mat-error
          *ngIf="
            accountForm.controls['code'].hasError('required') &&
            accountForm.controls['code'].touched
          "
        >
          Account Code is required
        </mat-error>
      </mat-form-field> 
       <mat-form-field>
        <mat-label>Account Level</mat-label>
        <input
          matInput
          autocomplete="off"
          placeholder="Enter Account Level"
          formControlName="level"
        />
        <mat-error
          *ngIf="
            accountForm.controls['level'].hasError('required') &&
            accountForm.controls['level'].touched
          "
        >
          Account Level is required
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Account Type  -->
    <mat-form-field class="full-width">
      <mat-label>Select Account Type</mat-label>
      <mat-select
        (selectionChange)="onSelectedAccountType($event.value)"
        formControlName="accountTypeId"
        [disabled]="isEditMode"
      >
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let d of accountTypes" [value]="d.id">
          {{ d.name }}
        </mat-option>
      </mat-select>
      <mat-error>Account Type is required</mat-error>
    </mat-form-field>

    <!-- Parent Name -->
    <mat-form-field class="full-width">
      <mat-label>Select Parent Name</mat-label>
      <mat-select formControlName="parentId" [disabled]="isEditMode">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let d of parentNames" [value]="d.id">
          {{ d.treeName }}
        </mat-option>
      </mat-select>
      <mat-error>Parent Name is required</mat-error>
    </mat-form-field>

    <!-- Account Name -->
    <mat-form-field>
      <mat-label>Account Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter Account name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          accountForm.controls['name'].hasError('required') &&
          accountForm.controls['name'].touched
        "
      >
        Account name is required
      </mat-error>
    </mat-form-field>

    <!-- isControlAccount -->
    <section required>
      <mat-checkbox class="checkbox-margin" formControlName="isControlAccount">
        Is control account?
      </mat-checkbox>
    </section>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      cdkFocusInitial
      color="primary"
      [disabled]="!accountForm.dirty || !accountForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>

<!-- (selectionChange)="onSelectedAccountType($event.value)" -->
