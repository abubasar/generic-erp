<mat-card>
  <mat-expansion-panel
    class="mat-elevation-z0"
    (opened)="panelOpenState = true"
    (closed)="panelOpenState = false"
  >
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>search_icon</mat-icon> Search
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <div class="row row-cols-2 gx-5">
        <div class="col">
          <mat-form-field class="full-width">
            <mat-label>Keyword</mat-label>
            <input matInput formControlName="keyword" />
          </mat-form-field>
        </div>
      </div>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>search_icon</mat-icon>Search
      </button>
    </form>
  </mat-expansion-panel>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="button-container d-flex justify-content-between">
      <button
        *appHasPermission="['Permissions.Shifts.Create']"
        mat-raised-button
        color="primary"
        (click)="openForm()"
      >
        <!-- + Add New Product -->
        <mat-icon>add_box</mat-icon>
        Add New
      </button>
      <!-- Views Column Button -->
      <div>
        <button
          mat-icon-button
          color="primary"
          (click)="reload()"
          matTooltip="Reload"
          matTooltipPosition="above"
        >
          <mat-icon>refresh</mat-icon>
        </button>
        <!-- <button
          mat-icon-button
          color="primary"
          matTooltip="print pdf"
          matTooltipShowDelay="300"
          matTooltipPosition="above"
          (click)="printPdf()"
        >
          <mat-icon>print</mat-icon>
        </button> -->
        <button
          mat-icon-button
          matTooltip="Views Column"
          matTooltipShowDelay="300"
          [matMenuTriggerFor]="viewsColumn"
        >
          <mat-icon>view_module_icon</mat-icon>
        </button>
        <mat-menu
          class="margin-0 padding-0"
          #viewsColumn="matMenu"
          [formGroup]="viewColumnForm"
        >
          <span
            class="padding-0"
            mat-menu-item
            [disableRipple]="true"
            (click)="$event.stopPropagation()"
          >
            <mat-list role="list" class="margin-0 padding-0">
              <mat-list-item
                role="listitem"
                *ngFor="let cd of columnDefinitions"
              >
                <mat-checkbox [formControlName]="cd.def">
                  {{ cd.label }}
                </mat-checkbox>
              </mat-list-item>
            </mat-list>
          </span>
        </mat-menu>
      </div>
    </div>
    <ng-container *ngIf="!loading; else loadingSkeleton">
      <div
        class="table-responsive"
        *ngIf="dataSource.data.length > 0; else noDataFound"
      >
        <table
          class="border border-1 table-bordered"
          mat-table
          [dataSource]="dataSource"
        >
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let shift">{{ shift.name }}</td>
          </ng-container>

          <!-- fromTime Column -->
          <ng-container matColumnDef="fromTime">
            <th mat-header-cell *matHeaderCellDef>From Time</th>
            <td mat-cell *matCellDef="let shift">
              {{ shift.fromTime }}
            </td>
          </ng-container>

          <!-- toTime Column -->
          <ng-container matColumnDef="toTime">
            <th mat-header-cell *matHeaderCellDef>To Time</th>
            <td mat-cell *matCellDef="let shift">
              {{ shift.toTime }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th style="text-align: center" mat-header-cell *matHeaderCellDef>
              Actions
            </th>
            <td align="center" mat-cell *matCellDef="let shift">
              <button
                *appHasPermission="['Permissions.Shifts.Edit']"
                mat-icon-button
                color="primary"
                matTooltip="Edit"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="openForm(shift)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                *appHasPermission="['Permissions.Shifts.Delete']"
                mat-icon-button
                color="warn"
                matTooltip="Delete"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="confirmDelete(shift?.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns$ | async"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns$ | async"
            class="table-row"
            tabindex="1"
          ></tr>
        </table>
      </div>
      <mat-paginator
        *ngIf="totalCount > 0"
        [length]="totalCount"
        [pageSizeOptions]="[10, 20, 50, 100]"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select page of Shift list"
      >
      </mat-paginator>
    </ng-container>
  </mat-card-content>
</mat-card>

<!-- loader start -->
<ng-template #loadingSkeleton>
  <app-loading-skeleton></app-loading-skeleton>
</ng-template>
<!-- No Data Found -->
<ng-template #noDataFound>
  <app-no-data-found></app-no-data-found>
</ng-template>
