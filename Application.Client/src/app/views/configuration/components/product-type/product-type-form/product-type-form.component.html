<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="productTypeForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field class="full-width">
      <mat-label>Select Inventory Type</mat-label>
      <mat-select formControlName="inventoryTypeId">
        <mat-option>-- None --</mat-option>
        <mat-option *ngFor="let d of inventoryTypes" [value]="d.id">
          {{ d.name }}
        </mat-option>
      </mat-select>
      <mat-error>Inventory Type is required</mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Product Type Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter product type name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          productTypeForm.controls['name'].hasError('required') &&
          productTypeForm.controls['name'].touched
        "
      >
        Product Type name is required
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!productTypeForm.dirty || !productTypeForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
