<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="productCostSetupForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <div class="row row-cols-2 gx-5 gy-3">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Product</mat-label>
          <mat-select formControlName="productId">
            <mat-option>-- None --</mat-option>
            <mat-option *ngFor="let d of products" [value]="d.id">
              {{ d.name }}
            </mat-option>
          </mat-select>
          <mat-error>Product is required</mat-error>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field>
          <mat-label>Direct Expense</mat-label>
          <input
            matInput
            type="number"
            autocomplete="off"
            placeholder="Enter direct expense"
            formControlName="directExpense"
          />
          <mat-error>Direct Expense is required </mat-error>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field>
          <mat-label>Factory Overhead</mat-label>
          <input
            matInput
            type="number"
            autocomplete="off"
            placeholder="Enter factory overhead"
            formControlName="factoryOverhead"
          />
          <mat-error>Factory Overhead is required </mat-error>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!productCostSetupForm.dirty || !productCostSetupForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
