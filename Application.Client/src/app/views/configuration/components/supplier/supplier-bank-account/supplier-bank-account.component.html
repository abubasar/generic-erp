<table class="border border-1" mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="sl">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">{{ element?.name }}</td>
  </ng-container>

  <ng-container matColumnDef="accNo">
    <th mat-header-cell *matHeaderCellDef>A/c No</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.accNo }}
    </td>
  </ng-container>

  <ng-container matColumnDef="routingNo">
    <th mat-header-cell *matHeaderCellDef>Routing No</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.routingNo }}
    </td>
  </ng-container>

  <ng-container matColumnDef="bankName">
    <th mat-header-cell *matHeaderCellDef>Bank Name</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.bankName }}
    </td>
  </ng-container>

  <ng-container matColumnDef="branchName">
    <th mat-header-cell *matHeaderCellDef>Branch Name</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.branchName }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
