<mat-card>
  <mat-expansion-panel
    class="mat-elevation-z0"
    (opened)="panelOpenState = true"
    (closed)="panelOpenState = false"
  >
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>search_icon</mat-icon> Search
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <mat-form-field class="full-width">
        <mat-label>Keyword</mat-label>
        <input matInput formControlName="keyword" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>search_icon</mat-icon>Search
      </button>
    </form>
  </mat-expansion-panel>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="button-container d-flex justify-content-between">
      <button
        *appHasPermission="['Permissions.FinancialYears.Create']"
        mat-raised-button
        color="primary"
        (click)="openForm()"
      >
        <!-- + Add New Financial Year -->
        <mat-icon>add_box</mat-icon>
        Add New
      </button>
      <div>
        <button
          mat-icon-button
          color="primary"
          (click)="reload()"
          matTooltip="Reload"
          matTooltipPosition="above"
        >
          <mat-icon>refresh</mat-icon>
        </button>
        <button
          mat-icon-button
          color="primary"
          matTooltip="print pdf"
          matTooltipShowDelay="300"
          matTooltipPosition="above"
          (click)="printPdf()"
        >
          <mat-icon>print</mat-icon>
        </button>
      </div>
    </div>
    <ng-container *ngIf="!loading; else loadingSkeleton">
      <div
        class="table-responsive"
        *ngIf="dataSource.data.length > 0; else noDataFound"
      >
        <table
          class="border border-1 table-bordered"
          mat-table
          [dataSource]="dataSource"
        >
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let financialYear">
              {{ financialYear.name }}
            </td>
          </ng-container>

          <!-- startDate Column -->
          <ng-container matColumnDef="startDate">
            <th mat-header-cell *matHeaderCellDef>Start Date</th>
            <td mat-cell *matCellDef="let financialYear">
              {{ dateFormatService?.getDateFormat(financialYear?.startDate) }}
            </td>
          </ng-container>

          <!-- endDate Column -->
          <ng-container matColumnDef="endDate">
            <th mat-header-cell *matHeaderCellDef>End Date</th>
            <td mat-cell *matCellDef="let financialYear">
              {{ dateFormatService?.getDateFormat(financialYear?.endDate) }}
            </td>
          </ng-container>

          <!-- isActive Column -->
          <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef>Active</th>
            <td mat-cell *matCellDef="let financialYear">
              <mat-checkbox
                [disableRipple]="true"
                (click)="$event.preventDefault()"
                [checked]="financialYear.isActive"
              >
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th style="text-align: center" mat-header-cell *matHeaderCellDef>
              Actions
            </th>
            <td align="center" mat-cell *matCellDef="let financialYear">
              <button
                *appHasPermission="['Permissions.FinancialYears.Edit']"
                mat-icon-button
                color="primary"
                matTooltip="Edit"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="openForm(financialYear)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                *appHasPermission="['Permissions.FinancialYears.Delete']"
                mat-icon-button
                color="warn"
                matTooltip="Delete"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="confirmDelete(financialYear.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="table-row"
            tabindex="1"
          ></tr>
        </table>
      </div>

      <mat-paginator
        *ngIf="totalCount > 0"
        [length]="totalCount"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select page of Financial Year list"
      >
      </mat-paginator>
    </ng-container>
  </mat-card-content>
</mat-card>

<!-- loader start -->
<ng-template #loadingSkeleton>
  <app-loading-skeleton></app-loading-skeleton>
</ng-template>
<!-- No Data Found -->
<ng-template #noDataFound>
  <app-no-data-found></app-no-data-found>
</ng-template>
