<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="accountTypeForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Account Type Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter Account Type name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          accountTypeForm.controls['name'].hasError('required') &&
          accountTypeForm.controls['name'].touched
        "
      >
        Account Type name is required
      </mat-error>
    </mat-form-field>
     <mat-form-field>
      <mat-label>Starting Number</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter Starting Number"
        formControlName="startingNumber"
        type="number"
      />
      <mat-error
        *ngIf="
          accountTypeForm.controls['startingNumber'].hasError('required') &&
          accountTypeForm.controls['startingNumber'].touched
        "
      >
        Starting Number is required
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="!accountTypeForm.dirty || !accountTypeForm.valid"
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
