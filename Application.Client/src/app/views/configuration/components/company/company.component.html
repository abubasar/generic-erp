<mat-card>
  <mat-expansion-panel
    class="mat-elevation-z0"
    (opened)="panelOpenState = true"
    (closed)="panelOpenState = false"
    >
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>search_icon</mat-icon> Search
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <mat-form-field class="full-width">
        <mat-label>Keyword</mat-label>
        <input matInput formControlName="keyword" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>search_icon</mat-icon>Search
      </button>
    </form>
  </mat-expansion-panel>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="button-container d-flex justify-content-between">
      <button
        *appHasPermission="['Permissions.Companies.Create']"
        mat-raised-button
        color="primary"
        (click)="openForm()"
        >
        <!-- + Add New Company -->
        <mat-icon>add_box</mat-icon>
        Add New
      </button>
      <button
        mat-icon-button
        color="primary"
        (click)="reload()"
        matTooltip="Reload"
        matTooltipPosition="above"
        >
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
    @if (!loading) {
      @if (dataSource.data.length > 0) {
        <div
          class="table-responsive"
          >
          <table
            class="border border-1 table-bordered"
            mat-table
            [dataSource]="dataSource"
            >
            <!-- Code Column -->
            <ng-container matColumnDef="code">
              <th mat-header-cell *matHeaderCellDef>Code</th>
              <td mat-cell *matCellDef="let company">{{ company.code }}</td>
            </ng-container>
            <!-- Name Column -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let company">{{ company.name }}</td>
            </ng-container>
            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
              <th style="text-align: center" mat-header-cell *matHeaderCellDef>
                Actions
              </th>
              <td align="center" mat-cell *matCellDef="let company">
                <button
                  *appHasPermission="['Permissions.Companies.Edit']"
                  mat-icon-button
                  color="primary"
                  matTooltip="Edit"
                  matTooltipShowDelay="300"
                  matTooltipPosition="above"
                  (click)="openForm(company)"
                  >
                  <mat-icon>edit</mat-icon>
                </button>
                <button
                  *appHasPermission="['Permissions.Companies.Delete']"
                  mat-icon-button
                  color="warn"
                  matTooltip="Delete"
                  matTooltipShowDelay="300"
                  matTooltipPosition="above"
                  (click)="confirmDelete(company.id, $safeNavigationMigration(company?.code))"
                  >
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: displayedColumns"
              class="table-row"
              tabindex="1"
            ></tr>
          </table>
        </div>
      } @else {
        <app-no-data-found></app-no-data-found>
      }
      @if (totalCount > 0) {
        <mat-paginator
          [length]="totalCount"
          [pageSizeOptions]="pageSizeOptions"
          (page)="onPageChange($event)"
          showFirstLastButtons
          aria-label="Select page of company list"
          >
        </mat-paginator>
      }
    } @else {
      <app-loading-skeleton></app-loading-skeleton>
    }
  </mat-card-content>
</mat-card>
