<mat-card>
  <mat-expansion-panel
    class="mat-elevation-z0"
    (opened)="panelOpenState = true"
    (closed)="panelOpenState = false"
  >
    <mat-expansion-panel-header>
      <mat-panel-title>
        <mat-icon>search_icon</mat-icon> Search
      </mat-panel-title>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="searchForm" (ngSubmit)="onSearch()">
      <mat-form-field class="full-width">
        <mat-label>Search By Keyword</mat-label>
        <input matInput formControlName="keyword" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>search_icon</mat-icon>Search
      </button>
    </form>
  </mat-expansion-panel>
</mat-card>
<mat-card>
  <mat-card-content>
    <div class="button-container d-flex justify-content-between">
      <button
        *appHasPermission="['Permissions.EmailAccounts.Create']"
        mat-raised-button
        color="primary"
        (click)="openForm()"
      >
        <!-- + Add New Email Account -->
        <mat-icon>add_box</mat-icon>
        Add New
      </button>
      <div>
        <button
          mat-icon-button
          color="primary"
          (click)="reload()"
          matTooltip="Reload"
          matTooltipPosition="above"
        >
          <mat-icon>refresh</mat-icon>
        </button>
        <button
          mat-icon-button
          color="primary"
          matTooltip="print pdf"
          matTooltipShowDelay="300"
          matTooltipPosition="above"
          (click)="printPdf()"
        >
          <mat-icon>print</mat-icon>
        </button>
      </div>
    </div>
    <ng-container *ngIf="!loading; else loadingSkeleton">
      <div
        class="table-responsive"
        *ngIf="dataSource.data.length > 0; else noDataFound"
      >
        <table
          class="border border-1 table-bordered"
          mat-table
          [dataSource]="dataSource"
        >
          <!-- displayName Column -->
          <ng-container matColumnDef="displayName">
            <th mat-header-cell *matHeaderCellDef>Display Name</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.displayName }}
            </td>
          </ng-container>

          <!-- email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.email }}
            </td>
          </ng-container>

          <!-- host Column -->
          <ng-container matColumnDef="host">
            <th mat-header-cell *matHeaderCellDef>Host</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.host }}
            </td>
          </ng-container>

          <!-- username Column -->
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef>Username</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.username }}
            </td>
          </ng-container>

          <!-- password Column -->
          <ng-container matColumnDef="password">
            <th mat-header-cell *matHeaderCellDef>Password</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.password }}
            </td>
          </ng-container>

          <!-- port Column -->
          <ng-container matColumnDef="port">
            <th mat-header-cell *matHeaderCellDef>Port</th>
            <td mat-cell *matCellDef="let emailAccount">
              {{ emailAccount.port }}
            </td>
          </ng-container>

          <!-- enableSsl Column -->
          <ng-container matColumnDef="enableSsl">
            <th mat-header-cell *matHeaderCellDef>Enable SSL?</th>
            <td mat-cell *matCellDef="let emailAccount">
              <mat-checkbox
                [disableRipple]="true"
                (click)="$event.preventDefault()"
                [checked]="emailAccount.enableSsl"
              >
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- isDefaultEmailAccount Column -->
          <ng-container matColumnDef="isDefaultEmailAccount">
            <th mat-header-cell *matHeaderCellDef>Is Default Email Account?</th>
            <td mat-cell *matCellDef="let emailAccount">
              <mat-checkbox
                [disableRipple]="true"
                (click)="$event.preventDefault()"
                [checked]="emailAccount.isDefaultEmailAccount"
              >
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th style="text-align: center" mat-header-cell *matHeaderCellDef>
              Actions
            </th>
            <td align="center" mat-cell *matCellDef="let emailAccount">
              <button
                *appHasPermission="['Permissions.EmailAccounts.Edit']"
                mat-icon-button
                color="primary"
                matTooltip="Edit"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="openForm(emailAccount)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                *appHasPermission="['Permissions.EmailAccounts.Delete']"
                mat-icon-button
                color="warn"
                matTooltip="Delete"
                matTooltipShowDelay="300"
                matTooltipPosition="above"
                (click)="confirmDelete(emailAccount.id)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            class="table-row"
            tabindex="1"
          ></tr>
        </table>
      </div>

      <mat-paginator
        *ngIf="totalCount > 0"
        [length]="totalCount"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select page of account list"
      >
      </mat-paginator>
    </ng-container>
  </mat-card-content>
</mat-card>

<!-- loader start -->
<ng-template #loadingSkeleton>
  <app-loading-skeleton></app-loading-skeleton>
</ng-template>
<!-- No Data Found -->
<ng-template #noDataFound>
  <app-no-data-found></app-no-data-found>
</ng-template>
