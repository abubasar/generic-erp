<h2 mat-dialog-title>{{ formTitle }}</h2>
<form [formGroup]="fundTransferTransactionTypeForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography">
    <input mat type="hidden" formControlName="id" />
    <mat-form-field>
      <mat-label>Fund Transfer Transaction Type Name</mat-label>
      <input
        matInput
        autocomplete="off"
        placeholder="Enter Fund Transfer Transaction Type name"
        formControlName="name"
      />
      <mat-error
        *ngIf="
          fundTransferTransactionTypeForm.controls['name'].hasError(
            'required'
          ) && fundTransferTransactionTypeForm.controls['name'].touched
        "
      >
        Fund Transfer Transaction Type name is required
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-raised-button mat-dialog-close>Cancel</button>
    <button
      mat-raised-button
      [mat-dialog-close]="true"
      cdkFocusInitial
      color="primary"
      [disabled]="
        !fundTransferTransactionTypeForm.dirty ||
        !fundTransferTransactionTypeForm.valid
      "
      type="submit"
    >
      Save
    </button>
  </mat-dialog-actions>
</form>
