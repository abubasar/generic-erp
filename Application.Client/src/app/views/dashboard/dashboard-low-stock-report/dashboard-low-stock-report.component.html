<mat-card>
  <mat-card-content>
    <h5 class="text-center text-16 mb-16 font-weight-bold">Low Stock Items</h5>
    <div class="mat-elevation-z0">
      <table class="border border-1" mat-table [dataSource]="dataSource">
        <!-- Code Column -->
        <ng-container matColumnDef="productName">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let stock">{{ stock.productName }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="storeName">
          <th mat-header-cell *matHeaderCellDef>Store</th>
          <td mat-cell *matCellDef="let stock">{{ stock.storeName }}</td>
        </ng-container>

        <!-- Code Column -->
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let stock">{{ stock.availableQty }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <mat-paginator
        *ngIf="totalCount > 0"
        [length]="totalCount"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)"
        showFirstLastButtons
        aria-label="Select page of stock list"
      >
      </mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
