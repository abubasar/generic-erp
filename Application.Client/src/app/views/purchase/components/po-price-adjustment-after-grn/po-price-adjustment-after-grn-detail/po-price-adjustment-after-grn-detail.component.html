<table class="border border-1" mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="sl">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="productId">
    <th mat-header-cell *matHeaderCellDef>Product</th>
    <td mat-cell *matCellDef="let element">{{ element?.product?.name }}</td>
  </ng-container>

  <ng-container matColumnDef="measurementUnitId">
    <th mat-header-cell *matHeaderCellDef>Unit</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.product?.measurementUnit?.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="grnQuantity">
    <th mat-header-cell *matHeaderCellDef>GRN Qty</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.grnQuantity }}
    </td>
  </ng-container>

  <ng-container matColumnDef="grnRate">
    <th mat-header-cell *matHeaderCellDef>GRN Rate</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.grnRate }}
    </td>
  </ng-container>

  <ng-container matColumnDef="adjustmentQuantity">
    <th mat-header-cell *matHeaderCellDef>Adjustment Qty</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.adjustmentQuantity }}
    </td>
  </ng-container>

  <ng-container matColumnDef="adjustmentRate">
    <th mat-header-cell *matHeaderCellDef>Adjustment Rate</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.adjustmentRate }}
    </td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef>Variance</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.amount }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
