<table class="border border-1" mat-table [dataSource]="dataSource">
  <ng-container matColumnDef="sl">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
  </ng-container>

  <ng-container matColumnDef="productId">
    <th mat-header-cell *matHeaderCellDef>Item</th>
    <td mat-cell *matCellDef="let element">{{ element?.product?.name }}</td>
  </ng-container>

  <ng-container matColumnDef="measurementUnitId">
    <th mat-header-cell *matHeaderCellDef>Unit</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.product?.measurementUnit?.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="adjustmentQty">
    <th mat-header-cell *matHeaderCellDef>Adjustment Qty</th>
    <td mat-cell *matCellDef="let element">
      {{ element?.adjustmentQty | number : "1.2-3" }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
