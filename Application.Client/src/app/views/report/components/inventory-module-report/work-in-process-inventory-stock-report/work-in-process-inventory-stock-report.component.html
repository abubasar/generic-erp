<mat-card>
  <mat-card-title>Work In Process Inventory Stock</mat-card-title>
  <mat-card-content>
    <div class="button-container d-flex justify-content-end mb-2">
      <button
        mat-raised-button
        color="primary"
        matTooltip="PDF"
        matTooltipShowDelay="300"
        matTooltipPosition="above"
        (click)="printPdf('pdf')"
        [disabled]="isLoading1"
      >
        <ng-container *ngIf="isLoading1; else saveText">
          {{ "Processing..." }}
        </ng-container>
        <ng-template #saveText>
          <mat-icon>picture_as_pdf</mat-icon>
        </ng-template>
      </button>
      <button
        mat-raised-button
        matTooltip="EXCEL"
        matTooltipShowDelay="300"
        matTooltipPosition="above"
        color="warn"
        (click)="printPdf('excel')"
        [disabled]="isLoading2"
      >
        <ng-container *ngIf="isLoading2; else saveText2">
          {{ "Processing..." }}
        </ng-container>
        <ng-template #saveText2>
          <mat-icon>insert_drive_file</mat-icon>
        </ng-template>
      </button>
    </div>
    <div class="mat-elevation-z0">
      <table class="border border-1" mat-table [dataSource]="dataSource">
        <!-- Code Column -->
        <ng-container matColumnDef="productName">
          <th mat-header-cell *matHeaderCellDef>Product</th>
          <td mat-cell *matCellDef="let stock">{{ stock.productName }}</td>
        </ng-container>

        <!-- Code Column -->
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Quantity</th>
          <td mat-cell *matCellDef="let stock">{{ stock.availableQty }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Value</th>
          <td mat-cell *matCellDef="let stock">{{ stock.stockValue }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
