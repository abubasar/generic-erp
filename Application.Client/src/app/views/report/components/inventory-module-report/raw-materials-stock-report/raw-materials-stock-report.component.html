<mat-card>
  <mat-card-title>Item/RM Stock : Report</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
  >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Enter a date range</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input
              matStartDate
              formControlName="fromDate"
              placeholder="Start date"
              (focus)="picker.open()"
            />
            <input
              matEndDate
              formControlName="toDate"
              placeholder="End date"
              (focus)="picker.open()"
            />
          </mat-date-range-input>
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
          <mat-error
            *ngIf="
              searchForm.get('fromDate').hasError('required') ||
              searchForm.get('toDate').hasError('required')
            "
          >
            Date range is required.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col">
        <!-- productTypeId -->
        <mat-form-field class="full-width">
          <mat-label>Select Product Type</mat-label>
          <input
            type="text"
            matInput
            name="productTypeId"
            formControlName="productTypeId"
            [matAutocomplete]="productTypeAuto"
            (input)="handleProductTypeSearch()"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event, 'productTypeId')"
              *ngIf="searchForm?.get('productTypeId')?.value"
              aria-label="Clear"
              mat-icon-button
              type="button"
              name="productTypeId"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>
          <mat-autocomplete
            #productTypeAuto="matAutocomplete"
            [displayWith]="getProductTypeName.bind(this)"
          >
            <mat-option>-- All --</mat-option>
            <mat-option *ngFor="let d of filterProductTypes" [value]="d.id">
              {{ d.name }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <div class="col">
        <!-- storeId -->
        <mat-form-field class="full-width">
          <mat-label>Select Store</mat-label>
          <input
            type="text"
            matInput
            name="storeId"
            formControlName="storeId"
            [matAutocomplete]="auto"
            (input)="handleStoreSearch()"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event, 'storeId')"
              *ngIf="searchForm?.get('storeId')?.value"
              aria-label="Clear"
              mat-icon-button
              type="button"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>
          <mat-autocomplete
            #auto="matAutocomplete"
            [displayWith]="getStoreName.bind(this)"
          >
            <mat-option *ngFor="let d of filterStores" [value]="d.id">
              {{ d.name }}
            </mat-option>
          </mat-autocomplete>
          <mat-error>Store is required</mat-error>
        </mat-form-field>
      </div>
      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading1; else saveText">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText>
            <mat-icon>picture_as_pdf</mat-icon>
          </ng-template>
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading2; else saveText2">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText2>
            <mat-icon>insert_drive_file</mat-icon>
          </ng-template>
        </button>
      </div>
    </div>
  </form>
</mat-card>
