
<!-- Rm Uplaod -->
<div>
  <input type="file" accept=".xls, .xlsx"  (change)="onRMFileChange($event)" />
  <button [disabled]="loading1" mat-stroked-button color="primary" (click)="onRMFileUpload()">
    Upload Raw Materials
  </button>
  <button style="margin-left: 3px;" [disabled]="loading1" mat-stroked-button color="accent" (click)="download('RawMaterialsOpening')">
    Download Format
  </button>
</div>
