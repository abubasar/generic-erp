<mat-card>
  <mat-card-title>Summary Report of Current Stock, Purchase Rate & Quantity</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
  >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Enter a date</mat-label>
          <input
            #input1
            matInput
            name="toDate"
            [matDatepicker]="picker"
            formControlName="toDate"
            (focus)="picker.open()"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-datepicker #picker (closed)="input1.blur()"></mat-datepicker>
          <mat-error *ngIf="searchForm.get('toDate').hasError('required')">
            Date is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Product Type</mat-label>
          <mat-select
            formControlName="productTypeId"
            (selectionChange)="onSelectedProductType($event.value)"
          >
            <mat-option>-- All --</mat-option>
            <mat-option *ngFor="let d of productTypes" [value]="d?.id">
              {{ d?.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <!-- Product Autocomplete -->
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Product</mat-label>
          <input
            type="text"
            placeholder="Search Product"
            aria-label="Filter Product"
            matInput
            name="productId"
            formControlName="productId"
            [matAutocomplete]="product"
            (keyup)="onProductChange($event?.target?.value)"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event)"
              *ngIf="searchForm?.get('productId')?.value"
              aria-label="Clear"
              mat-icon-button
              type="button"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>
          <mat-autocomplete
            autoActiveFirstOption
            #product="matAutocomplete"
            [displayWith]="getProductName.bind(this)"
          >
            <mat-option
              *ngFor="let product of filteredProducts"
              [value]="product.id"
            >
              {{ product.name }}
              <span
                *ngIf="
                  product?.inventoryType?.id ===
                  Inventory_Type_Id_Finished_Goods_ID
                "
              >
                ({{
                  businessType === "2"
                    ? product?.bagWeight + " " + product?.measurementUnit?.name
                    : product?.packSize?.name
                }})
              </span>
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading1; else saveText">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText>
            <mat-icon>picture_as_pdf</mat-icon>
          </ng-template>
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading2; else saveText2">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText2>
            <mat-icon>insert_drive_file</mat-icon>
          </ng-template>
        </button>
      </div>
    </div>
  </form>
</mat-card>
