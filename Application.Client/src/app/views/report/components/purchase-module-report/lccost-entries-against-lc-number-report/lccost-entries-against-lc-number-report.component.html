<mat-card>
  <mat-card-title>LC Cost Entries Against LC Number</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
    >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <!-- purchaseOrderId -->
        <mat-form-field class="full-width">
          <mat-label>Select LC Number</mat-label>
          <input
            type="text"
            matInput
            name="purchaseOrderId"
            formControlName="purchaseOrderId"
            [matAutocomplete]="auto"
            (keyup)="handlePurchaseOrderSearch($event)"
            />
            <div matSuffix>
              @if (searchForm?.get('purchaseOrderId')?.value) {
                <button
                  (click)="clearInput($event, 'purchaseOrderId')"
                  aria-label="Clear"
                  mat-icon-button
                  type="button"
                  >
                  <mat-icon>clear</mat-icon>
                </button>
              }
              <mat-icon>keyboard_arrow_down</mat-icon>
            </div>

            <mat-autocomplete
              #auto="matAutocomplete"
              [displayWith]="getPurchaseOrderNoOrLcNumber.bind(this)"
              >
              @for (d of filterPurchaseOrders; track d) {
                <mat-option
                  matTooltip="{{ d.ponumber }}"
                  [value]="d.id"
                  >
                  lc no: {{ d.lcNumber }}  ({{ d.ponumber }})
                </mat-option>
              }
            </mat-autocomplete>
            <mat-error>LC Number is required</mat-error>
          </mat-form-field>
        </div>
        <div class="col">
          <button
            [style.marginRight]="'5px'"
            mat-raised-button
            matTooltip="PDF"
            name="pdf"
            color="primary"
            type="submit"
            [disabled]="isLoading1 || this.searchForm.invalid"
            >
            @if (isLoading1) {
              {{ "Processing..." }}
            } @else {
              <mat-icon>picture_as_pdf</mat-icon>
            }
          </button>
          <button
            mat-raised-button
            matTooltip="EXCEL"
            name="excel"
            color="warn"
            type="submit"
            [disabled]="isLoading2 || this.searchForm.invalid"
            >
            @if (isLoading2) {
              {{ "Processing..." }}
            } @else {
              <mat-icon>insert_drive_file</mat-icon>
            }
          </button>
        </div>
      </div>
    </form>
  </mat-card>
