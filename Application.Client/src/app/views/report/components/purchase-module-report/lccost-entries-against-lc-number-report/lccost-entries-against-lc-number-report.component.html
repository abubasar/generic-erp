<mat-card>
  <mat-card-title>LC Cost Entries Against LC Number</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
  >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <!-- purchaseOrderId -->
        <mat-form-field class="full-width">
          <mat-label>Select LC Number</mat-label>
          <input
            type="text"
            matInput
            name="purchaseOrderId"
            formControlName="purchaseOrderId"
            [matAutocomplete]="auto"
            (keyup)="handlePurchaseOrderSearch($event)"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event, 'purchaseOrderId')"
              *ngIf="searchForm?.get('purchaseOrderId')?.value"
              aria-label="Clear"
              mat-icon-button
              type="button"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>

          <mat-autocomplete
            #auto="matAutocomplete"
            [displayWith]="getPurchaseOrderNoOrLcNumber.bind(this)"
          >
            <mat-option
              matTooltip="{{ d.ponumber }}"
              *ngFor="let d of filterPurchaseOrders"
              [value]="d.id"
            >
              lc no: {{ d.lcNumber }}  ({{ d.ponumber }})
            </mat-option>
          </mat-autocomplete>
          <mat-error>LC Number is required</mat-error>
        </mat-form-field>
      </div>
      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading1; else saveText">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText>
            <mat-icon>picture_as_pdf</mat-icon>
          </ng-template>
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading2; else saveText2">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText2>
            <mat-icon>insert_drive_file</mat-icon>
          </ng-template>
        </button>
      </div>
    </div>
  </form>
</mat-card>
