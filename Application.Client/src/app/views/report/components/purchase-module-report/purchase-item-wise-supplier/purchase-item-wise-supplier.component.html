<mat-card>
  <mat-card-title>Purchase: Item, Supplier Wise</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
  >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Enter a date range</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input
              matStartDate
              formControlName="fromDate"
              placeholder="Start date"
              (focus)="picker.open()"
            />
            <input
              matEndDate
              formControlName="toDate"
              placeholder="End date"
              (focus)="picker.open()"
            />
          </mat-date-range-input>
          <mat-datepicker-toggle
            matSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
          <mat-error
            *ngIf="
              searchForm.get('fromDate').hasError('required') ||
              searchForm.get('toDate').hasError('required')
            "
          >
            Date range is required.
          </mat-error>
        </mat-form-field>
      </div>
      <!-- supplierId -->
      <!-- <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Supplier</mat-label>
          <input
            type="text"
            matInput
            name="supplierId"
            formControlName="supplierId"
            [matAutocomplete]="auto"
            (keyup)="handleSupplierSearch($event)"
          />
          <mat-autocomplete
            #auto="matAutocomplete"
            [displayWith]="getSupplierName.bind(this)"
          >
            <mat-option
              matTooltip="{{ d.address }}"
              *ngFor="let d of filterSuppliers"
              [value]="d.id"
            >
              {{ d.name }} ({{ d.code.slice(-4) }}) {{ d.address }}
            </mat-option>
          </mat-autocomplete>
          <mat-error>Supplier is required</mat-error>
        </mat-form-field>
      </div> -->
      <!-- Product Autocomplete -->
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Product</mat-label>
          <input
            type="text"
            placeholder="Search Product"
            aria-label="Filter Product"
            matInput
            name="productId"
            formControlName="productId"
            [matAutocomplete]="product"
            (keyup)="onProductChange($event?.target?.value)"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event, 'productId')"
              *ngIf="searchForm?.get('productId')?.value"
              aria-label="Clear"
              mat-icon-button
              type="button"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>
          <mat-autocomplete
            autoActiveFirstOption
            #product="matAutocomplete"
            [displayWith]="getProductName.bind(this)"
          >
            <mat-option
              *ngFor="let product of filterProducts"
              [value]="product.id"
            >
              {{ product.name }}
              {{
                businessType === "2" ? "" : "(" + product?.packSize?.name + ")"
              }}
            </mat-option>
          </mat-autocomplete>
          <mat-error>Product is required</mat-error>
        </mat-form-field>
      </div>
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Store</mat-label>
          <mat-select formControlName="storeId">
            <mat-option>-- All --</mat-option>
            <mat-option *ngFor="let d of stores" [value]="d?.id">
              {{ d?.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading1; else saveText">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText>
            <mat-icon>picture_as_pdf</mat-icon>
          </ng-template>
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading2; else saveText2">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText2>
            <mat-icon>insert_drive_file</mat-icon>
          </ng-template>
        </button>
      </div>
    </div>
  </form>
</mat-card>
