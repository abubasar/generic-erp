<div class="row">
  <div class="col-md-4">
    <div class="d-flex flex-column align-items-start row-gap-2">
      <button
        *appHasPermission="['Permissions.AccountsModuleReports.General_Ledger']"
        [ngClass]="getButtonClasses('form1')"
        (click)="loadForm('form1')"
      >
        General Ledger
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Account_Ledger_Day_Wise'
        ]"
        [ngClass]="getButtonClasses('form5')"
        (click)="loadForm('form5')"
      >
        Account Ledger (Day Wise)
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Supplier_Transaction_Report'
        ]"
        [ngClass]="getButtonClasses('form6')"
        (click)="loadForm('form6')"
      >
        Supplier Transaction : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Customer_Transaction_Report'
        ]"
        [ngClass]="getButtonClasses('form7')"
        (click)="loadForm('form7')"
      >
        Customer Transaction : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Daily_Transaction_Report'
        ]"
        [ngClass]="getButtonClasses('form8')"
        (click)="loadForm('form8')"
      >
        Daily Transaction : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Daily_Transaction_Detail_Report'
        ]"
        [ngClass]="getButtonClasses('form9')"
        (click)="loadForm('form9')"
      >
        Daily Transaction Detail : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Cash_Bank_Balance_Report'
        ]"
        [ngClass]="getButtonClasses('Cash_Bank_Balance_Report')"
        (click)="loadForm('Cash_Bank_Balance_Report')"
      >
        Cash & Bank Balance : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Cash_Book_Report'
        ]"
        [ngClass]="getButtonClasses('form10')"
        (click)="loadForm('form10')"
      >
        Cash Book : Report
      </button>

      <button
        *appHasPermission="['Permissions.AccountsModuleReports.Payment_Report']"
        [ngClass]="getButtonClasses('form2')"
        (click)="loadForm('form2')"
      >
        Payment Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Collection_Report'
        ]"
        [ngClass]="getButtonClasses('form3')"
        (click)="loadForm('form3')"
      >
        Collection Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.CogsCalculation_Report'
        ]"
        [ngClass]="getButtonClasses('form11')"
        (click)="loadForm('form11')"
      >
        COGS Calculation : Report
      </button>

      <button
        *appHasPermission="[
          'Permissions.AccountsModuleReports.Financial_Statement'
        ]"
        [ngClass]="getButtonClasses('form4')"
        (click)="loadForm('form4')"
      >
        Financial Statement
      </button>
    </div>
    <!-- Add more buttons as needed -->
  </div>

  <div class="col-md-8">
    <div *ngIf="selectedForm === 'form1'">
      <app-subsidiary-ledger></app-subsidiary-ledger>
    </div>
    <div *ngIf="selectedForm === 'form5'">
      <app-day-wise-account-ledger></app-day-wise-account-ledger>
    </div>
    <div *ngIf="selectedForm === 'form6'">
      <app-supplier-transaction-report></app-supplier-transaction-report>
    </div>
    <div *ngIf="selectedForm === 'form7'">
      <app-customer-transaction-report></app-customer-transaction-report>
    </div>
    <div *ngIf="selectedForm === 'form8'">
      <app-daily-transaction-report></app-daily-transaction-report>
    </div>
    <div *ngIf="selectedForm === 'form9'">
      <app-daily-transaction-detail-report></app-daily-transaction-detail-report>
    </div>
    <div *ngIf="selectedForm === 'Cash_Bank_Balance_Report'">
      <app-cash-bank-balance-report></app-cash-bank-balance-report>
    </div>
    <div *ngIf="selectedForm === 'form10'">
      <app-cash-book-report></app-cash-book-report>
    </div>
    <div *ngIf="selectedForm === 'form2'">
      <app-payment-report></app-payment-report>
    </div>
    <div *ngIf="selectedForm === 'form3'">
      <app-payment-collection-report></app-payment-collection-report>
    </div>
    <div *ngIf="selectedForm === 'form11'">
      <app-cogs-calculation></app-cogs-calculation>
    </div>
    <div *ngIf="selectedForm === 'form4'">
      <app-accounts-report></app-accounts-report>
    </div>
  </div>
</div>
