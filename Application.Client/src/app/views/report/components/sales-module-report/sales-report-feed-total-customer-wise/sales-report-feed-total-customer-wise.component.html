<mat-card>
  <mat-card-title>Sales Report : Feed Total (Customer Wise)</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
    >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Enter a date range</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input
              matStartDate
              formControlName="fromDate"
              placeholder="Start date"
              (focus)="picker.open()"
              />
              <input
                matEndDate
                formControlName="toDate"
                placeholder="End date"
                (focus)="picker.open()"
                />
              </mat-date-range-input>
              <mat-datepicker-toggle
                matSuffix
                [for]="picker"
              ></mat-datepicker-toggle>
              <mat-date-range-picker #picker></mat-date-range-picker>
              @if (
                searchForm.get('fromDate').hasError('required') ||
                searchForm.get('toDate').hasError('required')
                ) {
                <mat-error
                  >
                  Date range is required.
                </mat-error>
              }
            </mat-form-field>
          </div>

          <div class="col">
            <button
              [style.marginRight]="'5px'"
              mat-raised-button
              matTooltip="PDF"
              name="pdf"
              color="primary"
              type="submit"
              [disabled]="isLoading1 || this.searchForm.invalid"
              >
              @if (isLoading1) {
                {{ "Processing..." }}
              } @else {
                <mat-icon>picture_as_pdf</mat-icon>
              }
            </button>
            <button
              mat-raised-button
              matTooltip="EXCEL"
              name="excel"
              color="warn"
              type="submit"
              [disabled]="isLoading2 || this.searchForm.invalid"
              >
              @if (isLoading2) {
                {{ "Processing..." }}
              } @else {
                <mat-icon>insert_drive_file</mat-icon>
              }
            </button>
          </div>
        </div>
      </form>
    </mat-card>
