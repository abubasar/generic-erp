<mat-card>
  <mat-card-title>Month Wise Product Sale Report</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
    >
    <div class="row row-cols-2 gx-5">

      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
          >
          @if (isLoading1) {
            {{ "Processing..." }}
          } @else {
            <mat-icon>picture_as_pdf</mat-icon>
          }
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
          >
          @if (isLoading2) {
            {{ "Processing..." }}
          } @else {
            <mat-icon>insert_drive_file</mat-icon>
          }
        </button>
      </div>
    </div>
  </form>
</mat-card>
