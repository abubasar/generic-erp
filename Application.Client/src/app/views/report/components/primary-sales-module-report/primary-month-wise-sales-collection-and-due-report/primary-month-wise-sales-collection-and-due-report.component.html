<mat-card>
  <mat-card-title>Month Wise Sales, Collection & Due : Report</mat-card-title>
  <form
    autocomplete="off"
    [formGroup]="searchForm"
    (ngSubmit)="printPdf($event)"
  >
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Year</mat-label>
          <mat-select formControlName="year" required>
            <mat-option *ngFor="let year of yearList" [value]="year">
              {{ year }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="searchForm.get('year')?.hasError('required')">
            Year is required.
          </mat-error>
        </mat-form-field>
      </div>

      <!-- customerMarketingOfficerId -->
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Marketing Officer</mat-label>
          <input
            placeholder="Search Marketing Officer"
            aria-label="Filter Marketing Officer"
            type="text"
            matInput
            name="customerMarketingOfficerId"
            formControlName="customerMarketingOfficerId"
            [matAutocomplete]="customerMarketingOfficerAuto"
            (input)="handleMarketingOfficerSearch()"
          />
          <div matSuffix>
            <button
              (click)="clearInput($event, 'customerMarketingOfficerId')"
              *ngIf="
                searchForm?.get('customerMarketingOfficerId')?.value !== null &&
                searchForm?.get('customerMarketingOfficerId')?.value !== ''
              "
              aria-label="Clear"
              mat-icon-button
              type="button"
            >
              <mat-icon>clear</mat-icon>
            </button>
            <mat-icon>keyboard_arrow_down</mat-icon>
          </div>
          <mat-autocomplete
            #customerMarketingOfficerAuto="matAutocomplete"
            [displayWith]="getMarketingOfficerName.bind(this)"
          >
            <mat-option
              *ngFor="let d of filterMarketingOfficers"
              [value]="d.id"
            >
              {{ d?.firstName + " " + d?.lastName }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <div class="col">
        <button
          [style.marginRight]="'5px'"
          mat-raised-button
          matTooltip="PDF"
          name="pdf"
          color="primary"
          type="submit"
          [disabled]="isLoading1 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading1; else saveText">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText>
            <mat-icon>picture_as_pdf</mat-icon>
          </ng-template>
        </button>
        <button
          mat-raised-button
          matTooltip="EXCEL"
          name="excel"
          color="warn"
          type="submit"
          [disabled]="isLoading2 || this.searchForm.invalid"
        >
          <ng-container *ngIf="isLoading2; else saveText2">
            {{ "Processing..." }}
          </ng-container>
          <ng-template #saveText2>
            <mat-icon>insert_drive_file</mat-icon>
          </ng-template>
        </button>
      </div>
    </div>
  </form>
</mat-card>
