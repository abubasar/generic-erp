<mat-card>
  <mat-card-title>Product Price List</mat-card-title>
  <form autocomplete="off" [formGroup]="searchForm">
    <div class="row row-cols-2 gx-5">
      <div class="col">
        <mat-form-field class="full-width">
          <mat-label>Select Inventory Type</mat-label>
          <mat-select formControlName="inventoryTypeId">
            <mat-option>-- None --</mat-option>
            @for (d of inventoryTypes; track d) {
              <mat-option [value]="d?.id">
                {{ d?.name }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      @if (businessType === '1') {
        <div>
          <mat-form-field class="full-width">
            <mat-label>Select Category</mat-label>
            <mat-select formControlName="categoryId">
              <mat-option>-- None --</mat-option>
              @for (d of categories; track d) {
                <mat-option [value]="d?.id">
                  {{ d?.name }}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      }
      <div class="col">
        <!-- Is Purchase Product -->
        <section required>
          <h4 class="h4-margin">Item For</h4>
          <mat-checkbox
            class="checkbox-margin"
            formControlName="isPurchaseProduct"
            >
            Purchase
          </mat-checkbox>
          <mat-checkbox class="checkbox-margin" formControlName="isSaleProduct">
            Sale
          </mat-checkbox>
        </section>
      </div>
    </div>
    <div
      class="button-container d-flex justify-content-start"
      style="margin-top: 10px"
      >
      <button
        class="demo-button"
        mat-raised-button
        color="primary"
        matTooltip="PDF"
        matTooltipShowDelay="300"
        matTooltipPosition="above"
        (click)="printPdf('pdf')"
        [disabled]="isLoading1"
        >
        @if (isLoading1) {
          {{ "Processing..." }}
        } @else {
          <mat-icon>picture_as_pdf</mat-icon>
        }
      </button>
      <button
        class="demo-button"
        mat-raised-button
        matTooltip="EXCEL"
        matTooltipShowDelay="300"
        matTooltipPosition="above"
        color="warn"
        (click)="printPdf('excel')"
        [disabled]="isLoading2"
        >
        @if (isLoading2) {
          {{ "Processing..." }}
        } @else {
          <mat-icon>insert_drive_file</mat-icon>
        }
      </button>
    </div>
  </form>
</mat-card>
