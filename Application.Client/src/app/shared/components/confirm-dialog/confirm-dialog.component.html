<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content class="mat-typography">
  <p>{{ message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button #btnCancel  mat-raised-button (click)="onDismiss()">Cancel</button>
  <button  mat-raised-button color="warn" [disabled]="isConfirmDisabled" (click)="onConfirm()">Confirm</button>
</div>
