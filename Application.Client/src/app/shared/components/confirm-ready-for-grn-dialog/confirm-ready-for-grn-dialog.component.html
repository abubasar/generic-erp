<h1 mat-dialog-title>{{ title }}</h1>
<div mat-dialog-content class="mat-typography">
  <p>{{ message }}</p>
</div>
<div>
  <h1 style="font-weight: bold; text-align: center; font-size: 1em">
    Here is a preview of the LC cost entries related to the Purchase Order (PO)
    under approval.
  </h1>
  <table class="border border-1" mat-table [dataSource]="dataSource">
    <!-- lcCostEntryNo Column -->
    <ng-container matColumnDef="lcCostEntryNo">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let element">{{ element.lcCostEntryNo }}</td>
    </ng-container>

    <!-- debitAccountName Column -->
    <ng-container matColumnDef="debitAccountName">
      <th mat-header-cell *matHeaderCellDef>Debit Account</th>
      <td mat-cell *matCellDef="let element">{{ element.debitAccountName }}</td>
    </ng-container>

    <!-- creditAccountName Column -->
    <ng-container matColumnDef="creditAccountName">
      <th mat-header-cell *matHeaderCellDef>Credit Account</th>
      <td mat-cell *matCellDef="let element">
        {{ element.creditAccountName }}
      </td>
    </ng-container>

    <!-- amount Column -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let element">{{ element.amount }}</td>
    </ng-container>

    <!-- isIncludedWithinLandedCost Column -->
    <ng-container matColumnDef="isIncludedWithinLandedCost">
      <th mat-header-cell *matHeaderCellDef>Is Landed Cost</th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox
          [disableRipple]="true"
          (click)="$event.preventDefault()"
          [checked]="element?.isIncludedWithinLandedCost"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
<div mat-dialog-actions align="end">
  <button mat-raised-button (click)="onDismiss()">Cancel</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">Confirm</button>
</div>
